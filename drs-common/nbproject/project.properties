# NetBeans Project Properties - drs-common (shared library)
# Tier 0: serializable models + client/server protocol.
# Build first; produces dist/drs-common.jar for the other two tiers.

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
libs.path=libs
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
test.src.dir=test
build.dir=build
build.classes.dir=${build.dir}/classes
build.test.dir=${build.dir}/test/classes
dist.dir=dist
dist.jar=${dist.dir}/drs-common.jar
javac.source=11
javac.target=11
source.encoding=UTF-8
javac.test.classpath=${libs.path}/junit-4.13.2.jar:${libs.path}/hamcrest-core-1.3.jar
