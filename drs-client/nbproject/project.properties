# NetBeans Project Properties - drs-client (client tier)
# JavaFX GUI built with FXML (SceneBuilder-compatible).
# Depends on drs-common.jar (in libs/) and the JavaFX SDK (in javafx-sdk/).
#
# libs/ must contain:
#   drs-common.jar   (build the drs-common project first)
# javafx-sdk/        the JavaFX SDK folder (with lib/*.jar inside)
#
# Run the drs-server project BEFORE launching this client.

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
javafx.sdk.path=javafx-sdk
libs.path=libs
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
test.src.dir=test
build.dir=build
build.classes.dir=${build.dir}/classes
build.test.dir=${build.dir}/test/classes
dist.dir=dist
dist.jar=${dist.dir}/drs-client.jar
main.class=drs.client.MainApp
javac.source=11
javac.target=11
source.encoding=UTF-8
run.jvmargs=--module-path "${javafx.sdk.path}/lib" --add-modules javafx.controls,javafx.fxml
