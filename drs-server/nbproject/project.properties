# NetBeans Project Properties - drs-server (server tier)
# Multi-threaded socket server with MySQL DAO/service layers.
# Depends on drs-common.jar (placed in libs/).
#
# libs/ must contain:
#   drs-common.jar                 (build the drs-common project first)
#   mariadb-java-client-2.7.6.jar  (bundled MySQL-compatible JDBC driver)
#   junit-4.13.2.jar, hamcrest-core-1.3.jar   (for tests)
# To use the official MySQL Connector/J, also drop mysql-connector-j-*.jar here.

auxiliary.ModulePathsProblems.test.paths.check=false
build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
libs.path=libs
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
test.src.dir=test
build.dir=build
build.classes.dir=${build.dir}/classes
build.test.dir=${build.dir}/test/classes
dist.dir=dist
dist.jar=${dist.dir}/drs-server.jar
main.class=drs.server.net.DrsServer
javac.source=11
javac.target=11
source.encoding=UTF-8
